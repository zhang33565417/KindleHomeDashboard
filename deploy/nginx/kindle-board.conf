# 放入 /etc/nginx/conf.d/kindle-board.conf；此文件由 nginx.conf 的 http 块加载。
# 部署前替换所有 board.example.com，并准备对应的 HTTPS 证书和密码文件。
server {
    listen 80;
    server_name board.example.com;

    # HTTP 不接收管理操作，统一引导至加密入口。
    return 301 https://board.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name board.example.com;

    ssl_certificate /etc/letsencrypt/live/board.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/board.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # 默认保护整个站点，后续新增接口也必须先通过账号密码验证。
    auth_basic "Kindle Home Dashboard";
    auth_basic_user_file /etc/nginx/kindle-board.htpasswd;

    # Java 与 Nginx 在同一台主机运行；8080 不向公网开放。
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 密码只在入口验证，不转发给应用。
    proxy_set_header Authorization "";
    proxy_cache off;

    # 精确放行图片读取，不能将整个 /api/ 路径设为免认证。
    # 图片包含家庭信息；任何知道此地址的人都能查看和下载。
    location = /api/image {
        auth_basic off;
        # Nginx 允许 GET 时也允许 HEAD；其他方法直接返回 403。
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
